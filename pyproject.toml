[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtviz"
version = "0.8.1"
description = "Publication-quality survey data visualization: dot plots, comparison tables, venn diagrams, choropleth color tables, HTML/PDF/PNG/SVG export."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "GivingPulse Analytics" }]
keywords = ["visualization", "survey", "matplotlib", "reporting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib-venn>=0.11",
  "jinja2>=3.0",  # required by pandas Styler (compare_periods style=True)
]

[project.optional-dependencies]
waffle = ["pywaffle>=1.1"]
docs = ["sphinx>=7", "furo", "myst-parser", "sphinx-copybutton", "sphinx-autodoc-typehints", "pywaffle>=1.1"]
dev = ["pytest>=7", "pytest-cov", "ruff", "pillow"]

[project.urls]
Homepage = "https://github.com/Giving-Tuesday/gtviz"
Documentation = "https://gtviz.readthedocs.io"
Source = "https://github.com/Giving-Tuesday/gtviz"
Changelog = "https://github.com/Giving-Tuesday/gtviz/blob/main/CHANGELOG.md"
Issues = "https://github.com/Giving-Tuesday/gtviz/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gtviz"]

[tool.hatch.build.targets.sdist]
# Ship source + docs + tests, but not the large binary baseline/gallery
# images (regenerated on demand; they bloat the sdist and aren't needed to
# install or use the package).
exclude = [
  "tests/baseline/*.png",
  "tests/output",
  "docs/_static/gallery",
  "dist",
  "*.pdf",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Mirror the production/pandas-3 runtime rather than suppressing signals:
# opt into future no-silent-downcasting, and fail on our own warnings so
# deprecations surface in CI. Third-party deprecations we don't control are
# allowlisted individually.
filterwarnings = [
  "default",
  "error::FutureWarning:gtviz",
  "error::DeprecationWarning:gtviz",
  "ignore:The NumPy module was reloaded:UserWarning",
]

[tool.gtviz]
# documentation marker only; the flag is set in tests/conftest.py so it also
# applies when the library is used outside pytest.
