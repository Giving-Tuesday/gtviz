name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check src tests tools examples

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - name: Run tests (renders chart images to tests/output/)
        run: pytest --cov=gtviz --cov-report=term-missing
      - name: Upload rendered chart images for HUMAN review
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: test-images
          path: tests/output/
          retention-days: 30

  visual-regression:
    # HEADLESS image check: compares freshly rendered charts against
    # committed baselines in tests/baseline/. To accept intentional visual
    # changes, run `python tools/compare_images.py --update` locally and
    # commit the new baselines.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .[dev]
      - run: pytest -q
      - name: Compare images against baselines
        run: python tools/compare_images.py --threshold 1.0
      - name: Upload diff images on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: image-diffs
          path: tests/output/*_diff.png

  gallery:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .[dev,waffle]
      - name: Generate full gallery (PNG + SVG + HTML report + PDF)
        run: python examples/generate_gallery.py
      - uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: docs/_static/gallery/
